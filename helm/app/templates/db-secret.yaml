{{- if .Values.database.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "products-api.fullname" . }}-db
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "products-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  sa-password: "{{ .Values.database.saPassword }}"
{{- end -}}
