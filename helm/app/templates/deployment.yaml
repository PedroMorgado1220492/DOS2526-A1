apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "products-api.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "products-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "products-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "products-api.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.deployment.containerPort }}
          env:
            - name: ASPNETCORE_URLS
              value: "{{ .Values.env.aspnetcoreUrls }}"
            - name: ConnectionStrings__DefaultConnection
              value: 'Server={{ include "products-api.dbServiceName" . }},{{ .Values.database.port }};Database=ProductsDB;User Id=sa;Password={{ .Values.database.saPassword }};TrustServerCertificate=True;'
