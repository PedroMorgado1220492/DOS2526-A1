{{- if .Values.portainer.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-infra.fullname" . }}-portainer
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "platform-infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-infra.name" . }}-portainer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "platform-infra.name" . }}-portainer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: portainer
          image: {{ .Values.portainer.image }}
          ports:
            - containerPort: {{ .Values.portainer.service.port }}
          volumeMounts:
            - name: portainer-data
              mountPath: /data
      volumes:
        - name: portainer-data
          persistentVolumeClaim:
            claimName: {{ include "platform-infra.fullname" . }}-portainer
{{- end -}}
