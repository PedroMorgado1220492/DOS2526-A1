{{- if .Values.portainer.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-infra.fullname" . }}-portainer
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "platform-infra.labels" . | nindent 4 }}
spec:
  type: {{ .Values.portainer.service.type }}
  ports:
    - port: {{ .Values.portainer.service.port }}
      targetPort: {{ .Values.portainer.service.port }}
  selector:
    app.kubernetes.io/name: {{ include "platform-infra.name" . }}-portainer
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
